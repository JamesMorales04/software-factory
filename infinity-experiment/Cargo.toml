[package]
name = "factory-infinity-experiment"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Isolated, executable Infinity Runtime prototype for Software Factory"

[workspace]

[dependencies]
# Pinned dependency revision: never follow Infinity main.
infinity-agent-core = { git = "https://github.com/hydro-project/infinity", rev = "1abc6fcff1f186124f924b56aa92c3a3684c90c5" }
infinity-provider-protocol = { git = "https://github.com/hydro-project/infinity", rev = "1abc6fcff1f186124f924b56aa92c3a3684c90c5" }
rap-protocol = { git = "https://github.com/hydro-project/infinity", rev = "1abc6fcff1f186124f924b56aa92c3a3684c90c5" }
rap-client = { git = "https://github.com/hydro-project/infinity", rev = "1abc6fcff1f186124f924b56aa92c3a3684c90c5" }

async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 1

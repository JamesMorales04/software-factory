# Optional private Office access through an independently authenticated
# Tailscale node. Enable explicitly with both Compose files; never Funnel.
services:
  core:
    environment:
      FACTORY_TRUSTED_ORIGINS: ${FACTORY_TRUSTED_ORIGINS:?Set FACTORY_TRUSTED_ORIGINS to the exact https://<node>.<tailnet>.ts.net origin}
      FACTORY_TAILSCALE_ORIGIN: ${FACTORY_TRUSTED_ORIGINS:?Set FACTORY_TRUSTED_ORIGINS to the exact https://<node>.<tailnet>.ts.net origin}
      FACTORY_OFFICE_ACCESS_SOCKET: /office-socket/office.sock

  tailscale:
    image: docker.io/tailscale/tailscale@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${FACTORY_TAILSCALE_HOSTNAME:-factory-office}
      TS_SERVE_CONFIG: /etc/factory/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=64m
    volumes:
      - factory-tailscale-state:/var/lib/tailscale
      - factory-office-socket:/office-socket:ro
      - ./deploy/tailscale/serve.json:/etc/factory/serve.json:ro
    networks:
      - factory-tailscale-uplink
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 30s

volumes:
  factory-tailscale-state:

networks:
  factory-tailscale-uplink:
    internal: false

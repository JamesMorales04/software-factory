# Pinned via the `tool` directive in go.mod (golangci-lint v2.5.0).
# Same command runs locally and in CI: `go tool golangci-lint run ./...`
version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: false
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
issues:
  max-issues-per-linter: 50
  max-same-issues: 20

    deployment: []
    isolation: []
  limitations:
  - OpenCode and Codex App Server adapters support bounded multi-turn tool events and frozen-check execution through
    the Supervisor. OpenCode has managed live acceptance; Codex has deterministic real-executable coverage and a
    test-only GPT-6 Luna proxy record. A reviewer-only native Codex App Server `review/start` transport and
    dedicated ChatGPT credential volume are implemented behind `FACTORY_ENABLE_CODEX_REVIEW=1`; real ChatGPT
    login, live Luna review and ISOLATED dispatch remain NOT_TESTED.
  - SEC-01-ISOLATED is out of scope for the current TRUSTED_LOCAL product (ADR-0035); no isolation is claimed and
    isolated dispatch remains fail-closed.
  blockers:
  - Real ChatGPT login, live Luna review and the Office authentication-status surface remain pending; the current
    bootstrap is the reviewer CLI/Compose flow.

# Dependency policy for the Software Factory workspace.
#
# `advisories` is checked by `cargo audit`. RUSTSEC-2026-0459 is resolved by
# the vendored sqlx-sqlite manifest patch that selects libsqlite3-sys 0.39.1;
# do not add an audit ignore. Enable the advisory section only when the
# advisory gate is consolidated.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

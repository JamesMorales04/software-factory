# Dependency policy for the Software Factory workspace.
#
# `advisories` is intentionally checked by `cargo audit` today. The known
# RUSTSEC-2026-0459 / sqlx/libsqlite3-sys blocker is owned by the repository
# owner and must not be suppressed here. Enable the advisory section only when
# that blocker is resolved.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MIT-0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# F1-S3-D deterministic recovery gates. Same toolchain pins as S1.
# Runs the real Core + Worker + Chromium against a deterministic Paseo CLI
# simulator: Worker SIGKILL, Core restart, daemon disconnect/reconnect,
# unbound-session discovery, concurrent recovery, replay and identity
# mismatch. No daemon, no provider calls, no paid sessions.
name: s3d
"on":
  push:
    branches: [main, "f1-*"]
  pull_request:

jobs:
  s3d-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Office dependencies
        working-directory: office
        run: npm ci --no-audit --no-fund
      - name: Install browser test dependencies
        working-directory: office/e2e-browser
        run: npm ci --no-audit --no-fund
      - name: Install Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: S3-D crash, restart, cleanup, concurrency and browser recovery
        env:
          FACTORY_S3D_STRICT: "1"
          CHROMIUM_EXE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/e2e-s3d.sh

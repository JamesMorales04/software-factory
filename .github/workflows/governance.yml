name: Governance consistency

on:
  pull_request:
    # Intentionally has no path filter. The entry gate must run for every PR;
    # repository-wide governance cannot be protected by a path-filtered job.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

jobs:
  architecture-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Assess PR architecture impact
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 .github/scripts/check-pr-architecture-impact.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test PR impact gate
        run: python3 .github/scripts/test_check_pr_architecture_impact.py
      - name: Run checker tests
        run: cargo test --manifest-path native/Cargo.toml --locked --bin factory-architecture-check
      - name: Validate capability registry and generated roadmap
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            cargo run --manifest-path native/Cargo.toml --locked --bin factory-architecture-check -- --root . --base-ref "$BASE_REF"
          else
            cargo run --manifest-path native/Cargo.toml --locked --bin factory-architecture-check -- --root .
          fi

# F1-S3-B acceptance gates. Same toolchain pins as S1 (core/go.mod + tool
# directive). Unit/contract/recovery tests already run in s1.yml's core job
# (`go test -race ./...`); this job adds the S3-B Worker lifecycle journey
# through Core + Worker with a stubbed `paseo` CLI. No Paseo daemon, no
# provider calls, no paid sessions: the live three-model lane runs attended
# only (scripts/e2e-s3b.sh with FACTORY_S3B_LIVE=1).
name: s3b
"on":
  push:
    branches: [main, "f1-*"]
  pull_request:

jobs:
  s3b-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: S3-B Worker lifecycle, fencing, stub-success, S2 regression
        working-directory: .
        env:
          FACTORY_S3B_LIVE: "0"
        run: bash scripts/e2e-s3b.sh

name: Native Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record candidate SHA
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Install pinned cargo-audit
        run: cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +1.90.0 audit --file Cargo.lock
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +1.90.0 test --workspace --locked
      - name: Build
        run: cargo +1.90.0 build --bins --locked
      - name: Native architecture consistency
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            cargo +1.90.0 run --locked --bin factory-architecture-check -- --root . --base-ref "origin/$GITHUB_BASE_REF"
          else
            cargo +1.90.0 run --locked --bin factory-architecture-check -- --root .
          fi
      - name: Inventory active legacy files
        run: |
          cargo +1.90.0 run --locked --bin factory-repo-hygiene -- --mode audit > "$RUNNER_TEMP/repo-hygiene.txt"
          tail -n 1 "$RUNNER_TEMP/repo-hygiene.txt"
      - name: Preserve migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: native-rust-repository-hygiene
          path: ${{ runner.temp }}/repo-hygiene.txt

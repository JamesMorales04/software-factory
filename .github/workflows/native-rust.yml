name: Native Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record candidate SHA
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Subscription-only real-provider UAT harness contract tests
        run: node --test scripts/real-provider-uat.test.mjs
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Install pinned cargo-audit
        run: cargo +1.90.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +1.90.0 audit --file Cargo.lock
      - name: Install and verify bubblewrap for provider-boundary tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr             --ro-bind-try /bin /bin --ro-bind-try /lib /lib             --ro-bind-try /lib64 /lib64 --proc /proc /bin/true
      - name: Install pinned SQLx CLI
        run: cargo +1.90.0 install sqlx-cli --version 0.8.6 --no-default-features --features sqlite --locked
      - name: Verify migrations from a clean database
        run: cargo +1.90.0 xtask migrate
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +1.90.0 test --workspace --locked
      - name: Build
        run: cargo +1.90.0 build --bins --locked
      - name: Documentation
        run: cargo +1.90.0 doc --workspace --no-deps --locked
      - name: Deterministic process-level recovery E2E
        run: cargo +1.90.0 xtask e2e recovery
      - name: Deterministic fixture dispatch E2E
        run: cargo +1.90.0 xtask e2e dispatch
      - name: Authorization, scope and lease negatives
        run: cargo +1.90.0 xtask e2e negatives
      - name: Deterministic fake-provider execution E2E
        run: cargo +1.90.0 xtask e2e provider
      - name: Native architecture consistency
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            cargo +1.90.0 run --locked --bin factory-architecture-check -- --root . --base-ref "origin/$GITHUB_BASE_REF"
          else
            cargo +1.90.0 xtask validate-architecture
          fi
      - name: Strict zero-legacy repository hygiene
        run: cargo +1.90.0 run --locked --bin factory-repo-hygiene -- --mode strict

  compose-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate Compose topology and static security policy
        run: |
          docker compose -f compose.yaml config --format json > /tmp/compose.json
          python3 .github/scripts/check-compose-policy.py /tmp/compose.json
          COMPOSE_CONFIG_JSON=/tmp/compose.json python3 .github/scripts/test_check_compose_policy.py
          FACTORY_TRUSTED_ORIGINS=https://factory-office.example.ts.net \
            docker compose -f compose.yaml -f compose.tailscale.yaml config --format json > /tmp/compose-tailscale.json
          python3 .github/scripts/check-compose-policy.py /tmp/compose-tailscale.json
          COMPOSE_CONFIG_JSON=/tmp/compose-tailscale.json python3 .github/scripts/test_check_compose_policy.py

  container-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install rootless Podman and Compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman info --format '{{.Host.Security.Rootless}}'
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
      - name: Align the development image with the runner UID/GID
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the container-native development image
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        run: podman compose -f compose.yaml -f compose.dev.yaml build dev
      - name: Containerized Rust gates
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        run: podman compose -f compose.yaml -f compose.dev.yaml run --rm --no-deps dev cargo xtask check-container
      - name: Containerized Office gates
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        run: |
          podman compose -f compose.yaml -f compose.dev.yaml run --rm --no-deps dev \
            sh -c 'npm --prefix office ci && npm --prefix office run typecheck && npm --prefix office run lint && npm --prefix office run test && npm --prefix office run build'
      - name: Containerized Factory browser capability
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
        run: |
          podman compose -f compose.yaml -f compose.dev.yaml run --rm --no-deps \
            -e FACTORY_PLAYWRIGHT_CORE=/workspaces/software-factory/office/e2e-browser/node_modules/playwright-core \
            dev sh -c 'npm --prefix office/e2e-browser ci && cargo test --locked -p factory-native --test browser'
      - name: Containerized Chromium Office and unified-intake journeys
        env:
          PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
          FACTORY_BROWSER_NO_SANDBOX: "1"
        run: |
          podman compose -f compose.yaml -f compose.dev.yaml run --rm --no-deps \
            -e FACTORY_BROWSER_NO_SANDBOX=1 dev \
            sh -c 'npm --prefix office ci && npm --prefix office/e2e-browser ci && cargo xtask e2e office && cargo xtask e2e intake'

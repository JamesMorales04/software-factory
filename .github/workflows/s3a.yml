# F1-S3-A acceptance gates. Same toolchain pins as S1 (core/go.mod + tool
# directive). Unit/contract/recovery tests already run in s1.yml's core job
# (`go test -race ./...`); this job adds the S3-A durable session-identity
# journey (no Paseo daemon, no provider calls, no Podman required).
name: s3a
"on":
  push:
    branches: [main, "f1-*"]
  pull_request:

jobs:
  s3a-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: S3-A session identity, fencing, restart, S2 regression
        working-directory: .
        run: bash scripts/e2e-s3a.sh

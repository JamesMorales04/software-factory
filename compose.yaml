# Software Factory developer-preview Compose deployment.
#
# One command starts Core/Office, Worker, Supervisor, independent verifier and
# reviewer, the dedicated nested execution engine and its narrow runtime
# broker. Only Office is published, on host loopback. Durable data lives in
# named volumes and survives `podman compose down`.
#
# Supported Compose providers: podman-compose, or Docker Compose through an
# enabled rootless Podman socket (podman.socket). See docs/operations/compose.md.

name: software-factory

x-restricted: &restricted
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped

x-control-env: &control-env
  FACTORY_CORE_URL: http://core:8765
  FACTORY_CONTAINER_MODE: "1"

# Every reviewer role runs as its own process with its own token file,
# principal and role. The model route may be identical; independence is the
# authenticated identity/process, not model or provider diversity.
x-reviewer-base: &reviewer-base
  build:
    context: .
    dockerfile: deploy/Containerfile
    target: reviewer
  image: software-factory-reviewer:dev
  user: "10001:10001"
  <<: *restricted
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
  command:
    - /bin/sh
    - -c
    - until [ -f /config/.ready ]; do sleep 1; done; until curl -fsS http://runtime:8770/health >/dev/null 2>&1; do sleep 1; done; exec /usr/local/bin/factory-reviewer
  networks:
    - factory-control
    - factory-egress
  stop_grace_period: 20s

services:
  init:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: core
    image: software-factory-core:dev
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    entrypoint: ["/usr/local/bin/factory-compose-init"]
    environment:
      FACTORY_CONFIG_CORE_DIR: /config-core
      FACTORY_CONFIG_WORKER_DIR: /config-worker
      FACTORY_CONFIG_SUPERVISOR_DIR: /config-supervisor
      FACTORY_CONFIG_VERIFIER_DIR: /config-verifier
      FACTORY_CONFIG_REVIEWER_FUNCTIONAL_DIR: /config-reviewer-functional
      FACTORY_CONFIG_REVIEWER_ARCHITECTURE_DIR: /config-reviewer-architecture
      FACTORY_CONFIG_REVIEWER_CODE_QUALITY_DIR: /config-reviewer-code-quality
      FACTORY_CONFIG_REVIEWER_SECURITY_DIR: /config-reviewer-security
      FACTORY_CONFIG_REVIEWER_TESTING_DIR: /config-reviewer-testing
      FACTORY_CONFIG_REVIEWER_OPERABILITY_DIR: /config-reviewer-operability
      FACTORY_CORE_CONFIG_DIR: /config
      FACTORY_CONFIG_RUNTIME_DIR: /config-runtime
      FACTORY_CONFIG_OPENSPEC_DIR: /config-openspec
      FACTORY_DATA_DIR: /data
      FACTORY_PROJECTS_DIR: /projects
      FACTORY_PROVIDER_SESSIONS_DIR: /provider-sessions
      FACTORY_CODEX_HOME_DIR: /codex-home
      FACTORY_OFFICE_SOCKET_DIR: /office-socket
      FACTORY_CONFIG_UID: "10001"
    volumes:
      - factory-config-core:/config-core
      - factory-config-worker:/config-worker
      - factory-config-supervisor:/config-supervisor
      - factory-config-verifier:/config-verifier
      - factory-config-reviewer-functional:/config-reviewer-functional
      - factory-config-reviewer-architecture:/config-reviewer-architecture
      - factory-config-reviewer-code-quality:/config-reviewer-code-quality
      - factory-config-reviewer-security:/config-reviewer-security
      - factory-config-reviewer-testing:/config-reviewer-testing
      - factory-config-reviewer-operability:/config-reviewer-operability
      - factory-config-runtime:/config-runtime
      - factory-config-openspec:/config-openspec
      - factory-data:/data
      - factory-projects:/projects
      - factory-provider-sessions:/provider-sessions
      - factory-codex-home:/codex-home
      - factory-office-socket:/office-socket
    network_mode: none
    restart: "no"

  provider-bundle:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: provider
    image: localhost/software-factory-provider:dev
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /bundle
        rm -f /bundle/provider-rootfs.tar /bundle/provider-rootfs.tar.tmp /bundle/provider-rootfs.tar.ready
        tar --one-file-system \
          --exclude=./proc --exclude=./sys --exclude=./dev \
          --exclude=./bundle --exclude=./run --exclude=./tmp \
          -C / -cf /bundle/provider-rootfs.tar.tmp .
        sync /bundle/provider-rootfs.tar.tmp || true
        mv /bundle/provider-rootfs.tar.tmp /bundle/provider-rootfs.tar
        touch /bundle/provider-rootfs.tar.ready
    volumes:
      - factory-image-bundle:/bundle
    network_mode: none
    restart: "no"

  dependency-bundle:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: dependency
    image: localhost/software-factory-dependency:dev
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /bundle
        rm -f /bundle/dependency-rootfs.tar /bundle/dependency-rootfs.tar.tmp /bundle/dependency-rootfs.tar.ready
        tar --one-file-system \
          --exclude=./proc --exclude=./sys --exclude=./dev \
          --exclude=./bundle --exclude=./run --exclude=./tmp \
          -C / -cf /bundle/dependency-rootfs.tar.tmp .
        sync /bundle/dependency-rootfs.tar.tmp || true
        mv /bundle/dependency-rootfs.tar.tmp /bundle/dependency-rootfs.tar
        touch /bundle/dependency-rootfs.tar.ready
    volumes:
      - factory-image-bundle:/bundle
    network_mode: none
    restart: "no"

  runtime:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: runtime
    image: software-factory-runtime:dev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_BIND_SERVICE
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
      - SYS_ADMIN
      - NET_ADMIN
    group_add:
      - "10001"
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,noexec,nosuid,size=256m
      - /var/tmp:rw,noexec,nosuid,size=1g
    volumes:
      - factory-engine:/var/lib/containers
      - factory-provider-sessions:/provider-sessions
      - factory-image-bundle:/bundles:ro
      - factory-config-runtime:/config:ro
    environment:
      TMPDIR: /var/lib/containers/tmp
      FACTORY_BIND: 0.0.0.0:8770
      FACTORY_CONTAINER_MODE: "1"
      FACTORY_RUNTIME_BROKER_TOKEN_DIR: /config
      FACTORY_RUNTIME_IMAGES: docker.io/library/rust:1.90.0-bookworm
      FACTORY_RUNTIME_PROVIDER_IMAGES: localhost/software-factory-provider:dev
      # The installed stack is fail-closed for the live OpenCode route:
      # the deterministic fixture adapter is selected only by the explicit
      # E2E override, never by the base deployment default.
      FACTORY_RUNTIME_PROVIDER_KIND: ${FACTORY_PROVIDER_KIND:-opencode}
      FACTORY_RUNTIME_PROVIDER_SESSION_ROOT: /provider-sessions
      FACTORY_RUNTIME_IMPORT_IMAGES: localhost/software-factory-provider:dev=/bundles/provider-rootfs.tar
      FACTORY_RUNTIME_DEPENDENCY_IMAGE: localhost/software-factory-dependency:dev
      FACTORY_RUNTIME_DEPENDENCY_BUNDLE: /bundles/dependency-rootfs.tar
      FACTORY_RUNTIME_DEPENDENCY_REGISTRIES: sparse+https://index.crates.io/,registry+https://github.com/rust-lang/crates.io-index
      FACTORY_RUNTIME_DEPENDENCY_EGRESS_NETWORK: factory-deps-egress
      FACTORY_RUNTIME_DEPENDENCY_EGRESS_SUBNET: 10.90.0.0/24
      FACTORY_RUNTIME_DEPENDENCY_EGRESS_GATEWAY: 10.90.0.1
      FACTORY_RUNTIME_DEPENDENCY_EGRESS_PORT: "18080"
      FACTORY_RUNTIME_DEPENDENCY_EGRESS_ALLOW: index.crates.io:443,static.crates.io:443,github.com:443,codeload.github.com:443
    networks:
      - factory-control
      - factory-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8770/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 600s
    stop_grace_period: 30s

  core:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: core
    image: software-factory-core:dev
    user: "10001:10001"
    command:
      - /bin/sh
      - -c
      - until [ -f /config/.ready ]; do sleep 1; done; exec /usr/local/bin/factory-core
    <<: *restricted
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    ports:
      - "127.0.0.1:${FACTORY_PORT:-8893}:8765"
    volumes:
      - factory-data:/data
      - factory-config-core:/config:ro
      - factory-projects:/projects
      - factory-office-socket:/office-socket
    environment:
      # The full control listener binds only the dedicated control/egress
      # interfaces. It never listens on the optional Office-only network.
      FACTORY_BIND: core-control:8765,core-egress:8765
      FACTORY_CONTAINER_MODE: "1"
      FACTORY_DATABASE: /data/factory.sqlite
      FACTORY_OFFICE_DIR: /app/office
      FACTORY_PROJECTS_ROOT: /projects
      FACTORY_ENROLLMENT_CODE_FILE: /data/enrollment-code
      FACTORY_MASTER_KEY_FILE: /config/master.key
      FACTORY_OPERATOR_TOKEN_FILE: /config/operator.token
      FACTORY_WORKER_BOOTSTRAP_TOKEN_FILE: /config/worker-bootstrap.token
      FACTORY_VERIFIER_TOKEN_FILE: /config/verifier.token
      FACTORY_VERIFIER_PRINCIPAL: verifier-process
      FACTORY_REVIEWER_IDENTITIES_FILE: /config/reviewer-identities.json
      FACTORY_ATTEMPT_GRANT_KEY_FILE: /config/attempt-grant.key
      FACTORY_LEAD_FIXTURE_ASSESSOR: ${FACTORY_LEAD_FIXTURE_ASSESSOR:-0}
      FACTORY_ENABLE_AUTONOMOUS_START: "1"
      FACTORY_ENABLE_CODEX_REVIEW: "0"
    networks:
      factory-control:
        aliases:
          - core-control
      factory-egress:
        aliases:
          - core-egress
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: localhost:8765' http://core-control:8765/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s

  supervisor:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: supervisor
    image: software-factory-supervisor:dev
    user: "10001:10001"
    command:
      - /bin/sh
      - -c
      - until [ -f /config/.ready ]; do sleep 1; done; until curl -fsS http://runtime:8770/health >/dev/null 2>&1; do sleep 1; done; exec /usr/local/bin/factory-supervisor
    <<: *restricted
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - factory-projects:/projects
      - factory-supervisor-state:/state
      - factory-config-supervisor:/config:ro
    environment:
      <<: *control-env
      FACTORY_SUPERVISOR_BIND: 0.0.0.0:8766
      FACTORY_SUPERVISOR_TOKEN_FILE: /config/supervisor.token
      FACTORY_ATTEMPT_GRANT_KEY_FILE: /config/attempt-grant.key
      FACTORY_SUPERVISOR_CAPABILITY_KEY_FILE: /config/supervisor-capability.key
      FACTORY_SUPERVISOR_WORKSPACE_ROOT: /state/workspaces
      FACTORY_SUPERVISOR_STATE_ROOT: /state
      FACTORY_SUPERVISOR_PROJECT_ROOTS: /projects
      FACTORY_SUPERVISOR_IMAGES: docker.io/library/rust:1.90.0-bookworm
      FACTORY_RUNTIME_BROKER_URL: http://runtime:8770
      FACTORY_RUNTIME_BROKER_TOKEN_FILE: /config/runtime-broker-supervisor.token
    networks:
      - factory-control
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8766/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: worker
    image: software-factory-worker:dev
    user: "10001:10001"
    command:
      - /bin/sh
      - -c
      - until [ -f /config/.ready ]; do sleep 1; done; until curl -fsS http://supervisor:8766/health >/dev/null 2>&1; do sleep 1; done; until curl -fsS http://runtime:8770/health >/dev/null 2>&1; do sleep 1; done; exec /usr/local/bin/factory-worker
    <<: *restricted
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - factory-provider-sessions:/provider-sessions
      - factory-projects:/projects:ro
      - factory-config-worker:/config:ro
    environment:
      <<: *control-env
      FACTORY_WORKER_ID: compose-worker
      FACTORY_WORKER_BOOTSTRAP_TOKEN_FILE: /config/worker-bootstrap.token
      FACTORY_WORKER_REGISTRATION_KEY_FILE: /config/worker-registration.key
      FACTORY_WORKER_RECOVER_ON_START: "1"
      FACTORY_SUPERVISOR_URL: http://supervisor:8766
      FACTORY_SUPERVISOR_TOKEN_FILE: /config/supervisor.token
      FACTORY_WORKER_FIXTURE_IMAGE: docker.io/library/rust:1.90.0-bookworm
      FACTORY_PROVIDER_SANDBOX: container
      # Fixture execution is an explicit deterministic-test choice, not a
      # silent fallback for an unconfigured live provider route.
      FACTORY_PROVIDER_KIND: ${FACTORY_PROVIDER_KIND:-opencode}
      FACTORY_PROVIDER_SESSION_ROOT: /provider-sessions
      FACTORY_RUNTIME_BROKER_URL: http://runtime:8770
      FACTORY_RUNTIME_BROKER_TOKEN_FILE: /config/runtime-broker-provider.token
      FACTORY_FIXTURE_FILE: src/fixture.txt
      FACTORY_FIXTURE_CONTENT: "fixture candidate\n"
    networks:
      - factory-control
      - factory-egress
    stop_grace_period: 20s

  verifier:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: verifier
    image: software-factory-verifier:dev
    user: "10001:10001"
    command:
      - /bin/sh
      - -c
      - until [ -f /config/.ready ]; do sleep 1; done; until curl -fsS http://runtime:8770/health >/dev/null 2>&1; do sleep 1; done; exec /usr/local/bin/factory-verifier
    <<: *restricted
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - factory-projects:/projects
      - factory-verifier-state:/state
      - factory-config-verifier:/config:ro
    environment:
      <<: *control-env
      FACTORY_VERIFIER_TOKEN_FILE: /config/verifier.token
      FACTORY_RUNTIME_BROKER_URL: http://runtime:8770
      FACTORY_RUNTIME_BROKER_TOKEN_FILE: /config/runtime-broker-verifier.token
      FACTORY_VERIFIER_IMAGE: docker.io/library/rust:1.90.0-bookworm
      FACTORY_VERIFIER_WORKSPACE: /state
      FACTORY_VERIFIER_WATCH: "1"
    networks:
      - factory-control
    stop_grace_period: 20s

  reviewer-functional:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-functional-state:/state
      - factory-config-reviewer-functional:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-functional.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-functional-process
      FACTORY_REVIEWER_ROLE: FUNCTIONAL
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  reviewer-architecture:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-architecture-state:/state
      - factory-config-reviewer-architecture:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-architecture.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-architecture-process
      FACTORY_REVIEWER_ROLE: ARCHITECTURE
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  reviewer-code-quality:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-code-quality-state:/state
      - factory-config-reviewer-code-quality:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-code-quality.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-code-quality-process
      FACTORY_REVIEWER_ROLE: CODE_QUALITY
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  reviewer-security:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-security-state:/state
      - factory-config-reviewer-security:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-security.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-security-process
      FACTORY_REVIEWER_ROLE: SECURITY
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  reviewer-testing:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-testing-state:/state
      - factory-config-reviewer-testing:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-testing.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-testing-process
      FACTORY_REVIEWER_ROLE: TESTING
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  reviewer-operability:
    <<: *reviewer-base
    volumes:
      - factory-projects:/projects:ro
      - factory-reviewer-operability-state:/state
      - factory-config-reviewer-operability:/config:ro
      - factory-codex-home:/codex-home
    environment:
      <<: *control-env
      FACTORY_REVIEWER_TOKEN_FILE: /config/reviewer-operability.token
      FACTORY_REVIEWER_PRINCIPAL: reviewer-operability-process
      FACTORY_REVIEWER_ROLE: OPERABILITY
      FACTORY_REVIEW_MECHANISM: AUTO
      FACTORY_REVIEWER_WATCH: "1"
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_REVIEW_WORKSPACE: /state
      FACTORY_CODEX_REVIEW_TIMEOUT_SECS: "300"

  # Profile-gated, one-shot OpenSpec validation job. It fetches the latest
  # Core-rendered projection over the private control network, writes the change
  # into an isolated tmpfs workspace and runs the pinned CLI. It is not part of
  # the steady-state stack and never mounts project source or the Core database.
  openspec-validate:
    build:
      context: deploy/openspec
      dockerfile: Dockerfile
    image: localhost/software-factory-openspec:1.16.1
    profiles: ["openspec-validation"]
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /workspace:rw,nosuid,nodev,size=64m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - factory-config-openspec:/config:ro
    environment:
      FACTORY_CORE_URL: http://core:8765
      FACTORY_OPERATOR_TOKEN_FILE: /config/operator.token
      FACTORY_OPENSPEC_REQUEST_ID: ${FACTORY_OPENSPEC_REQUEST_ID:-}
      FACTORY_OPENSPEC_WORKSPACE: /workspace
    entrypoint: ["node", "/opt/openspec/validate.mjs"]
    networks:
      - factory-control

  codex-auth:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: reviewer
    image: software-factory-reviewer:dev
    user: "10001:10001"
    profiles: ["codex-auth"]
    <<: *restricted
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["/usr/local/bin/factory-reviewer", "codex-login"]
    volumes:
      - factory-codex-home:/codex-home
    environment:
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
      FACTORY_CODEX_LOGIN_MODE: ${FACTORY_CODEX_LOGIN_MODE:-device}
    networks:
      - factory-egress

  codex-status:
    build:
      context: .
      dockerfile: deploy/Containerfile
      target: reviewer
    image: software-factory-reviewer:dev
    user: "10001:10001"
    profiles: ["codex-auth"]
    <<: *restricted
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["/usr/local/bin/factory-reviewer", "codex-status"]
    volumes:
      - factory-codex-home:/codex-home
    environment:
      FACTORY_CODEX_HOME: /codex-home
      FACTORY_CODEX_BINARY: /usr/local/bin/codex
    networks:
      - factory-egress

volumes:
  factory-office-socket:
  factory-config-core:
  factory-config-worker:
  factory-config-supervisor:
  factory-config-verifier:
  factory-config-reviewer-functional:
  factory-config-reviewer-architecture:
  factory-config-reviewer-code-quality:
  factory-config-reviewer-security:
  factory-config-reviewer-testing:
  factory-config-reviewer-operability:
  factory-config-runtime:
  factory-config-openspec:
  factory-data:
  factory-projects:
  factory-provider-sessions:
  factory-image-bundle:
  factory-engine:
  factory-supervisor-state:
  factory-verifier-state:
  factory-reviewer-functional-state:
  factory-reviewer-architecture-state:
  factory-reviewer-code-quality-state:
  factory-reviewer-security-state:
  factory-reviewer-testing-state:
  factory-reviewer-operability-state:
  factory-codex-home:

networks:
  # Netavark applies bridge isolation only to non-internal networks. The
  # control network therefore declares an explicit no-default-route policy
  # instead of `internal: true`, so it is isolated from other bridges while
  # still denying container egress.
  factory-control:
    internal: false
    driver_opts:
      isolate: "true"
      no_default_route: "true"
  factory-egress:
    driver_opts:
      isolate: "true"

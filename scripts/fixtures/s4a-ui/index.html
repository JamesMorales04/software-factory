<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Calculator fixture</title>
  </head>
  <body>
    <main>
      <h1>Calculator</h1>
      <label>A <input id="a" type="number" value="0" /></label>
      <label>B <input id="b" type="number" value="0" /></label>
      <label>
        Operation
        <select id="op">
          <option value="add">add</option>
          <option value="multiply">multiply</option>
        </select>
      </label>
      <button id="calc" type="button">Calculate</button>
      <output id="result">-</output>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
